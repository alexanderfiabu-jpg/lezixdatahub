<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEZIX DATA HUB</title>
  <meta name="description" content="LEZIX DATA HUB affordable MTN data bundles. Quick order via WhatsApp or phone call.">
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#07172d;color:#fff}
    .wrap{max-width:900px;margin:auto;padding:18px}
    .flyer{width:100%;display:block;border-radius:18px;box-shadow:0 14px 40px rgba(0,0,0,.45)}
    .card{margin-top:20px;background:linear-gradient(145deg,#0c2345,#071326);border:1px solid rgba(255,193,7,.45);border-radius:18px;padding:22px;box-shadow:0 12px 35px rgba(0,0,0,.35)}
    h1{margin:0 0 6px;text-align:center;color:#ffd21a;font-size:30px}
    .sub{text-align:center;margin:0 0 20px;color:#dbe8ff}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    label{font-weight:700;color:#fff}
    select,input{width:100%;margin-top:7px;padding:13px;border-radius:10px;border:1px solid #496789;background:#fff;color:#111;font-size:16px}
    .buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
    a.btn{display:block;text-align:center;text-decoration:none;padding:15px;border-radius:12px;font-weight:800}
    .wa{background:#25d366;color:#071326}
    .call{background:#ffc400;color:#071326}
    .note{text-align:center;margin:16px 0 0;color:#aebfd8;font-size:13px}
    footer{text-align:center;color:#9fb2cc;padding:18px 0 8px;font-size:13px}
    @media(max-width:600px){.grid,.buttons{grid-template-columns:1fr}.wrap{padding:10px}h1{font-size:25px}}
  </style>
</head>
<body>
  <main class="wrap">
    <img class="flyer" src="banner.jpg" alt="LEZIX DATA HUB MTN data bundle flyer">

    <section class="card">
      <h1>Quick Order</h1>
      <p class="sub">Choose your data bundle and place your order instantly.</p>

      <div class="grid">
        <div>
          <label for="bundle">Data Bundle</label>
          <select id="bundle">
            <option value="1GB - GH₵6.00">1 GB - GH₵6.00</option>
            <option value="2GB - GH₵12.00">2 GB - GH₵12.00</option>
            <option value="3GB - GH₵18.00">3 GB - GH₵18.00</option>
            <option value="4GB - GH₵24.00">4 GB - GH₵24.00</option>
            <option value="5GB - GH₵29.00">5 GB - GH₵29.00</option>
            <option value="6GB - GH₵36.00">6 GB - GH₵36.00</option>
            <option value="8GB - GH₵44.00">8 GB - GH₵44.00</option>
            <option value="10GB - GH₵52.00">10 GB - GH₵52.00</option>
            <option value="15GB - GH₵72.00">15 GB - GH₵72.00</option>
            <option value="20GB - GH₵95.00">20 GB - GH₵95.00</option>
            <option value="25GB - GH₵115.00">25 GB - GH₵115.00</option>
            <option value="30GB - GH₵144.00">30 GB - GH₵144.00</option>
            <option value="40GB - GH₵175.00">40 GB - GH₵175.00</option>
            <option value="50GB - GH₵220.00">50 GB - GH₵220.00</option>
          </select>
        </div>

        <div>
          <label for="phone">Recipient Phone Number</label>
          <input id="phone" type="tel" placeholder="e.g. 0241234567">
        </div>
      </div>

      <div class="buttons">
        <a id="whatsapp" class="btn wa" href="https://wa.me/233249186074" target="_blank" rel="noopener">📱 Order on WhatsApp</a>
        <a class="btn call" href="tel:+233249186074">📞 Call 0249186074</a>
      </div>
      <p class="note">WhatsApp: 0249186074 · Call: 0249186074</p>
    </section>

    <footer>© LEZIX DATA HUB · Affordable data bundles</footer>
  </main>

  <script>
    const bundle = document.getElementById('bundle');
    const phone = document.getElementById('phone');
    const whatsapp = document.getElementById('whatsapp');

    function updateWhatsApp(){
      const message = `Hello LEZIX DATA HUB, I want to order ${bundle.value}. Recipient number: ${phone.value || '[please provide number]'}.`;
      whatsapp.href = `https://wa.me/233249186074?text=${encodeURIComponent(message)}`;
    }
    bundle.addEventListener('change', updateWhatsApp);
    phone.addEventListener('input', updateWhatsApp);
    updateWhatsApp();
  </script>
</body>
</html>
